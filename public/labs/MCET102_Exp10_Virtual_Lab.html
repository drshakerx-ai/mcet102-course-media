<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCET 102 Virtual Lab</title><meta name="description" content="Yanbu Industrial College, Mechanical Engineering Department, MCET 102 Mechanical Measurements virtual lab"><style>:root{--m:#6b1f24;--m2:#8e2b31;--ink:#1f2328;--mut:#5d6470;--bg:#f4f1ee;--card:#fff;--line:#d9d2cc;--ok:#1f7a3a;--okbg:#e3f4e8;--bad:#b42318;--badbg:#fde8e6;--auto:#e6f1fb;--warn:#a15c00;--warnbg:#fff4e0;--steel:#9aa3ad;--steel2:#6d7782}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
header.top{background:#fff;border-bottom:4px solid var(--m);padding:10px 18px;display:flex;align-items:center;gap:16px}
header.top .t{flex:1;min-width:0}
header.top .dept{font-weight:700;color:var(--m);font-size:17px}
header.top .col{color:var(--mut);font-size:13px}
header.top .lab{font-size:20px;font-weight:700;margin-top:4px}
header.top .crs{font-size:13px;color:var(--mut)}
header.top img.logo{height:62px;width:auto}
.info{display:flex;flex-wrap:wrap;gap:10px;padding:10px 18px;background:#fbf8f6;border-bottom:1px solid var(--line)}
.info label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;flex:1;min-width:150px}
.info input{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:5px}
nav.tabs{display:flex;gap:4px;padding:8px 18px 0;background:var(--bg);position:sticky;top:0;z-index:5;flex-wrap:wrap}
nav.tabs button{font:inherit;border:1px solid var(--line);border-bottom:none;background:#ebe5e0;padding:8px 14px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:#fff;color:var(--m);font-weight:700;border-color:var(--m)}
main{padding:0 18px 40px}
html,body{overflow-x:hidden}
.grid2>div{min-width:0}
section.tab{display:none;background:#fff;border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:16px 18px}
section.tab.on{display:block}
h2{color:var(--m);font-size:18px;margin:16px 0 8px}
h2:first-child{margin-top:0}
h3{font-size:15px;margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
.note{background:var(--warnbg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:4px;font-size:14px;margin:8px 0}
.tip{background:var(--auto);border-left:4px solid #2b6cb0;padding:8px 12px;border-radius:4px;font-size:14px;margin:8px 0}
ol.steps li,ul.list li{margin:3px 0}
table.t{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:14px}
table.t th,table.t td{border:1px solid #bfb6ae;padding:5px 6px;text-align:center;vertical-align:middle}
table.t th{background:#efe7e2;color:#3b1114}
table.t td.l{text-align:left}
table.t input,table.t select,table.t textarea{font:inherit;width:100%;min-width:60px;padding:4px 5px;border:1px solid #c9c2bb;border-radius:4px;background:#fff}
table.t textarea{min-height:46px;resize:vertical}
input.auto{background:var(--auto)!important;border-color:#8db6e0!important}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important}
.btn{font:inherit;border:1px solid var(--m);background:var(--m);color:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;margin:2px}
.btn.s{background:#fff;color:var(--m)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:#1f7a3a;border-color:#1f7a3a}
.btn.stop{background:#b42318;border-color:#b42318}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.ctl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:#fbfaf9}
.ctl h4{margin:0 0 6px;font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.03em}
.ctl select{max-width:100%}
.ctl select,.ctl input[type=number]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px}
.ctl label{font-size:13px;color:var(--mut)}
.disp{font-family:Consolas,monospace;background:#1d2328;color:#7CFC9A;padding:3px 8px;border-radius:4px;display:inline-block;min-width:70px;text-align:right}
.log{height:150px;overflow:auto;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fcfcfc}
.log div{border-bottom:1px dotted #e3ddd8;padding:2px 0}
.log .e{color:var(--bad);font-weight:600}.log .g{color:var(--ok)}.log .w{color:var(--warn)}
svg.sim{width:100%;height:auto;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;display:block;touch-action:none;user-select:none}
.alarm{position:fixed;inset:0;background:rgba(120,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
.alarm.on{display:flex}
.alarm .box{background:#fff;border:4px solid var(--bad);border-radius:10px;padding:18px 22px;max-width:460px;text-align:center;animation:fl 0.5s 3}
.alarm h3{color:var(--bad);margin:0 0 6px;font-size:20px}
@keyframes fl{50%{box-shadow:0 0 0 12px rgba(180,35,24,.35)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:.95}
.score{font-weight:700;padding:6px 10px;border-radius:6px;display:inline-block}
.figbox{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;margin:8px 0}
.figbox svg{width:100%;height:auto;display:block}
.cap{font-size:13px;text-align:center;color:var(--mut);margin-top:4px}
.chk{display:flex;gap:6px;align-items:flex-start;margin:3px 0;font-size:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#efe7e2;color:#3b1114;margin-left:4px}
.dialbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.small{font-size:12.5px;color:var(--mut)}
footer{padding:12px 18px;font-size:12px;color:var(--mut);text-align:center}
@media print{
 nav.tabs,.noprint,.btn,footer,.alarm,.toast{display:none!important}
 section.tab{display:none!important;border:none;padding:0}
 section#tab-report{display:block!important}
 body{background:#fff}
 main{padding:0}
 table.t{page-break-inside:auto}
 tr{page-break-inside:avoid}
}

/* ---- v2: header, branding and machine rendering ---- */
header.top{border-bottom:4px solid var(--m);padding:12px 22px;gap:20px;background:linear-gradient(180deg,#fff 0%,#fbf8f6 100%)}
header.top .yic{font-weight:800;letter-spacing:.06em;font-size:16px;color:#1f2328;text-transform:uppercase}
header.top .dept{font-weight:600;color:var(--m);font-size:15px}
header.top .col{color:var(--mut);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
header.top .lab{font-size:21px;margin-top:6px}
header.top img.logo{height:66px;width:auto;flex:none}
.info label{min-width:130px}
.info label.id{flex:.8}.info label.nm{flex:1.6}
.btn{transition:filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.btn.armed{background:#b42318!important;color:#fff!important;border-color:#b42318!important}
svg.sim{background:linear-gradient(180deg,#f9fafb 0%,#eef1f4 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
svg.sim :is(rect,polygon,circle,path,ellipse)[fill="#4b5560"]{fill:url(#mDark)}
svg.sim :is(rect,polygon,circle,path,ellipse)[fill="#8a96a1"]{fill:url(#mSteel)}
svg.sim :is(rect,polygon,circle,path,ellipse)[fill="#6d7782"]{fill:url(#mJaw)}
svg.sim :is(rect,polygon,path,ellipse)[fill="#c0c7ce"]{fill:url(#mTool)}
svg.sim :is(rect,polygon,circle,path,ellipse)[fill="#9aa3ad"]{fill:url(#mWork)}
svg.sim :is(rect,polygon,circle,path,ellipse)[fill="#7c8794"]{fill:url(#mSteel2)}
svg.sim :is(rect,polygon,circle,path,ellipse)[fill="#7f8a96"]{fill:url(#mSteel2)}
svg.sim :is(rect,polygon,circle,path,ellipse):is([fill="#5f7f92"],[fill="#3d5767"],[fill="#2f4553"],[fill="#5f6b78"]){fill:url(#mPaint)}
svg.sim rect[fill="#f7f8fa"][x="0"][y="0"]{fill:url(#mBg)}
.estop-ctl,.mini-ctl{scroll-margin-top:60px}
@media print{header.top{background:#fff}}
/* ---- measurement & inspection labs ---- */
.readbox{border:1px dashed #c9c2bb;border-radius:8px;padding:6px 10px;margin:6px 0;background:#fffdf8}
.readbox .rd{font:inherit;padding:5px 7px;border:1px solid #c9c2bb;border-radius:5px}
.tscroll{overflow-x:auto;max-width:100%}
textarea.concl{width:100%;min-height:80px;font:inherit;padding:6px;border:1px solid #c9c2bb;border-radius:6px}
.chart svg{width:100%;height:auto;display:block}
.inst{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;margin:6px 0}
.inst svg{width:100%;height:auto;display:block}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.parts button.on{background:var(--m);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px}
.big{font-family:Consolas,monospace;font-size:20px}
.done{color:var(--ok);font-weight:600}
table.mini{border-collapse:collapse;font-size:12.5px;margin:4px 0}
table.mini td,table.mini th{border:1px solid #d6cfc8;padding:2px 6px;text-align:center}
table.mini th{background:#efe7e2}
table.mini td.rec{background:#e6f1fb}
@media print{.readbox{display:none}}
.nosave{background:#fff4e0;border:1px solid #f0c36d;color:#7a4b00;border-radius:8px;padding:8px 12px;margin:8px 16px 0;font-size:14px}
.instcap{font-size:14px;color:#333;line-height:1.45;margin:6px 6px 2px}
.copy{text-align:center;font-size:13px;color:#5d6470;margin:4px 0 14px}
@media print{.copy{display:block}}

.guide{position:fixed;top:12px;right:12px;width:256px;max-height:calc(100vh - 24px);overflow:auto;background:#fff;border:2px solid var(--m);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:60;font-size:13px;line-height:1.35}
.guide h4{margin:0;padding:8px 10px;background:var(--m);color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:14px;position:sticky;top:0}
.guide .gx{background:none;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.guide .gi{padding:6px 10px 0;color:var(--mut);font-size:12px}
.guide ol{list-style:none;margin:0;padding:6px}
.guide li{border:1px solid var(--line);border-radius:7px;margin:4px 0;cursor:pointer;padding:6px 8px}
.guide li:hover{border-color:var(--m2)}
.guide li .n{display:inline-block;min-width:21px;height:21px;border-radius:50%;background:#ece7e3;text-align:center;line-height:21px;font-weight:700;margin-right:6px;font-size:12px}
.guide li.on{border-color:var(--m);background:#fbf6f4}
.guide li.ok .n{background:var(--ok);color:#fff}
.guide .gd{display:none;margin-top:6px;color:#333}
.guide li.on .gd{display:block}
.guide .gw{margin-top:5px;background:var(--warnbg);border-radius:5px;padding:4px 6px}
.gtab{position:fixed;right:0;top:38%;z-index:60;writing-mode:vertical-rl;background:var(--m);color:#fff;border:0;border-radius:8px 0 0 8px;padding:12px 6px;cursor:pointer;font-weight:700;font-size:13px}
.ghl{outline:3px solid #f2b705 !important;outline-offset:2px;animation:gpulse .8s ease-in-out 4}
@keyframes gpulse{50%{outline-color:rgba(242,183,5,.15)}}
@media(min-width:760px){body.gopen{padding-right:272px}}
@media(max-width:759px){.guide{top:auto;bottom:0;right:0;left:0;width:auto;max-height:46vh;border-radius:10px 10px 0 0}.gtab{top:auto;bottom:16px;writing-mode:horizontal-tb;border-radius:8px 0 0 8px}}
@media print{.guide,.gtab{display:none!important}body.gopen{padding-right:0}}

GB.r=function(v,sys){return sys==='in'?Math.round(v*10000)/10000:Math.round(v*1000)/1000;};

GB.recommend=function(target,sys){var t=GB.r(target,sys),out=[];var set=GB.sets[sys];var used={};function take(v){for(var i=0;i<set.length;i++){if(!used[i]&&Math.abs(set[i].v-v)<1e-7&&!set[i].w){used[i]=1;out.push(set[i].v);return true;}}return false;}
 if(sys==='mm'){var d3=Math.round(t*1000)%10;if(d3){if(take(1+d3/1000))t=GB.r(t-(1+d3/1000),sys);}
  var h=Math.round(t*100)%50;/* hundredths within half-mm */if(h){var c=1+h/100;if(c>1.49)c-=0.5;if(take(GB.r(c,sys)))t=GB.r(t-c,sys);}

  if(tens>0){if(tens<=100)take(tens);}

 d.querySelector('.rdshow').onclick=function(){var t=o.truth();if(t==null)return;msg.innerHTML='The instrument reads <b>'+(o.show?o.show(t):t.toFixed(o.dec==null?3:o.dec)+' '+(o.unit||''))+'</b>. Study how it is read, then carry on — this reading is recorded as <i>assisted</i>.';o.onOk(+t.toFixed(o.dec==null?3:o.dec),true);tries=0;d.querySelector('.rdshow').style.display='none';VL.S.data._assisted=(VL.S.data._assisted||0)+1;VL.save();};
 return {reset:function(){inp.value='';msg.textContent='';tries=0;d.querySelector('.rdshow').style.display='none';},el:d};
};

 mean:function(a){return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:NaN;},

function tableHTML(t){var s='<div class="tscroll"><table class="t">';if(t.head)t.head.forEach(function(r){s+='<tr>'+r.map(function(c){return typeof c==='string'?'<th>'+c+'</th>':'<th'+(c.span?' colspan="'+c.span+'"':'')+(c.rs?' rowspan="'+c.rs+'"':'')+'>'+c.t+'</th>';}).join('')+'</tr>';});else if(t.cols)s+='<tr>'+t.cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';(typeof t.rows==='function'?t.rows():t.rows).forEach(function(r){s+='<tr>'+r.map(cellHTML).join('')+'</tr>';});return s+'</table></div>';}

function expOf(c){try{return typeof c.exp==='function'?c.exp(V,S.data):c.exp;}catch(e){return NaN;}}
function within(v,e,tol){tol=tol||{rel:0.01};if(isNaN(v)||e==null||isNaN(e))return false;if(tol.abs!=null)return Math.abs(v-e)<=tol.abs+1e-9;var r=tol.rel==null?0.01:tol.rel;return Math.abs(v-e)<=Math.max(Math.abs(e)*r,tol.min||0.0005)+1e-9;}
VL.within=within;
function judge(c){var id=c.in||c.sel;var inp=$('[data-in="'+id+'"]',rp);if(!inp)return null;if(inp.value===''){inp.classList.remove('ok','bad');return null;}
 var good;if(c.sel){var an=typeof c.ans==='function'?c.ans(V,S.data):c.ans;if(an==null){inp.classList.remove('ok','bad');inp.title='Record the readings this answer depends on first';return null;}good=inp.value===String(an);}else{var e=expOf(c);if(e==null||isNaN(e)){inp.classList.remove('ok','bad');inp.title='Record the readings this answer depends on first';return null;}var vv=VL.num(inp.value,c.dm);good=c.abs?within(Math.abs(vv),Math.abs(e),c.tol):within(vv,e,c.tol);}
 inp.classList.toggle('ok',good);inp.classList.toggle('bad',!good);inp.title='';return good;}
